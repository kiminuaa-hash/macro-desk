name: 宏观工作台每日更新

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-desk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓数据 + 算模型 + 生成工作台
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        working-directory: macro_regime_desk
        run: python run.py
      - name: 把结果提交回仓库
        run: |
          git config user.name "macro-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "daily: $(date -u +%F)"
            git push
          fi
      - name: 准备 GitHub Pages 站点
        run: |
          mkdir -p site
          cp macro_regime_desk/output/dashboard.html site/index.html
          cp -r macro_regime_desk/output/*.md site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
